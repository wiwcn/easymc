[workspace]
resolver = "2"
members = [
    "crates/easymc-core",
    "crates/easymc-meta",
    "crates/easymc-mods",
    "crates/easymc-agent",
    "crates/easymc-share",
    "crates/easymc-launch-desktop",
    "crates/easymc-cli",
    "crates/easymc-container",
    "src-tauri",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
authors = ["EasyMC Contributors"]
repository = "https://github.com/easymc/easymc"

[workspace.dependencies]
easymc-core = { path = "crates/easymc-core" }
easymc-meta = { path = "crates/easymc-meta" }
easymc-mods = { path = "crates/easymc-mods" }
easymc-agent = { path = "crates/easymc-agent" }
easymc-share = { path = "crates/easymc-share" }
easymc-launch-desktop = { path = "crates/easymc-launch-desktop" }
easymc-container = { path = "crates/easymc-container" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
tracing = "0.1"
