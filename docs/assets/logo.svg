<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="EasyMC">
  <title>EasyMC</title>
  <defs>
    <linearGradient id="gFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ec4b4"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="gTop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad9cb"/>
      <stop offset="100%" stop-color="#3eb5a4"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f7a70"/>
      <stop offset="100%" stop-color="#145a53"/>
