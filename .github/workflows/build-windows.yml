name: Build Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag (empty = artifact only)"
        required: false
        default: "v0.1.10"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: windows-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (NSIS)
        # Unsigned OK — Windows SmartScreen may warn on first run.
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          # Workspace Cargo target lives at repo-root /target (not src-tauri/target)
          $search = @(
            "target/release/bundle/nsis",
            "src-tauri/target/release/bundle/nsis"
          )
          $found = $false
          foreach ($dir in $search) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter "*-setup.exe" -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName -Destination "dist-windows/" -Force
                Write-Host "NSIS:" $_.FullName
                $found = $true
              }
            }
          }
          if (-not $found) {
            Write-Host "ERROR: no NSIS setup.exe found; listing bundles:"
            Get-ChildItem -Recurse "target/release/bundle" -ErrorAction SilentlyContinue | Select-Object FullName
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          $exeCandidates = @(
            "target/release/easymc-app.exe",
            "src-tauri/target/release/easymc-app.exe",
            "target/release/EasyMC.exe"
          )
          foreach ($p in $exeCandidates) {
            if (Test-Path $p) {
              Copy-Item $p -Destination "dist-windows/easymc-app.exe" -Force
              Write-Host "EXE:" $p
              break
            }
          }
          # Green/portable marker for the unpack-and-run exe (installer ignores this file).
          $marker = @(
            '# EasyMC portable mode',
            '# Place this file next to easymc-app.exe to keep data under ./data/',
            '# 把本文件放在 easymc-app.exe 旁边即可启用便携（绿色）目录。'
          ) -join "`n"
          Set-Content -Path "dist-windows/portable.txt" -Value $marker -Encoding utf8
          Write-Host "Wrote dist-windows/portable.txt"
          Get-ChildItem dist-windows | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easymc-windows-0.1.10
          path: dist-windows/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          NOTES="$(cat <<'MD'
          ## EasyMC ${TAG}（Windows）

          桌面端定稿安装包（未签名，首次运行可能被 SmartScreen 拦截，选「仍要运行」即可）。

          ### 下载
          - **EasyMC_${VER}_x64-setup.exe** — NSIS 安装程序（推荐）
          - **easymc-app.exe** — 免安装便携版（需自行放置；一般用 setup）

          ### 说明
          - Java Edition 启动器（Rust + Lit + Tauri）
          - 含助手 / 下载 / 账户 / 一键环境等桌面 M1 能力
          - 默认窗口 1100×700
          MD
          )"
          # Normalize tag interpolation (heredoc was literal)
          VER="${TAG#v}"
          SETUP="EasyMC_${VER}_x64-setup.exe"
          NOTES=$(printf '%s\n' "## EasyMC ${TAG}（Windows）" "" "桌面端定稿安装包（未签名，首次运行可能被 SmartScreen 拦截，选「仍要运行」即可）。" "" "### 下载" "- **${SETUP}** — NSIS 安装程序（推荐）" "- **easymc-app.exe** — 免安装便携主程序" "" "### 说明" "- Java Edition 启动器（Rust + Lit + Tauri）" "- 含助手 / Agent 工具卡 / .mrpack / 下载 / 账户 / 一键环境" "- 便携模式：附带 portable.txt，与 easymc-app.exe 同目录即可绿色运行" "- 默认窗口 1100×700")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-windows/* --clobber
            gh release edit "$TAG" --title "EasyMC ${TAG}" --notes "$NOTES"
          else
            gh release create "$TAG" dist-windows/* \
              --title "EasyMC ${TAG}" \
              --notes "$NOTES" \
              --latest
          fi
          echo "Release: https://github.com/wiwcn/easymc/releases/tag/${TAG}"
